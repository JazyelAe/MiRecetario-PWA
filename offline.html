<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sin conexión | Mi Recetario</title>
  <meta name="theme-color" content="#e8590c">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <!-- Estilos dentro del archivo: esta página debe verse aunque no haya nada más en caché. -->
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, "Segoe UI", sans-serif;
           background: #fffaf3; color: #2b2118; text-align: center; padding: 24px; box-sizing: border-box; }
    .caja { max-width: 420px; }
    .icono { font-size: 64px; }
    h1 { color: #e8590c; margin: 8px 0; }
    a { display: inline-block; margin-top: 16px; background: #e8590c; color: #fff; padding: 10px 18px; border-radius: 10px;
        text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
  <div class="caja">
    <div class="icono">📡🍲</div>
    <h1>Estás sin conexión</h1>
    <p>Esta página todavía no estaba guardada en tu dispositivo. Tus recetas sí lo están: vuelve al inicio para verlas.</p>
    <a href="./">Ir a Mi Recetario</a>
  </div>
  <script>
    // Cuando vuelva la conexión, se recarga sola.
    window.addEventListener("online", () => location.reload());
  </script>
</body>
</html>
